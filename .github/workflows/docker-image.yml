name: Docker Image CI

on:
  workflow_dispatch:
    inputs:
      mapproxy_version:
        description: MapProxy version (also used as the image tag). Empty = ARG MAPPROXY_VERSION in the Dockerfile
        required: false
        default: ""
  # monthly rebuild (03:00 UTC on day 1), to pick up security fixes of the
  # base images and of the Debian and Python packages
  schedule:
    - cron: "0 3 1 * *"
  # pull_request:

permissions:
  contents: read

# one build at a time (e.g. a manual run and the monthly rebuild), so they never
# push the same tags in parallel; a running build is never cancelled
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # build, test, scan and tags in the reusable workflow of the base image (README
  # of gdal-oci, "Workflow reutilizável"): native runners per architecture, push
  # by digest, tags only after the tests and scans of both architectures
  image:
    uses: nds-cprm/gdal-oci/.github/workflows/oci-image.yml@main
    permissions:
      contents: read
      # upload of the SARIF reports to code scanning
      security-events: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      image: docker.io/ndscprm/mapproxy
      # the Dockerfile (ARG MAPPROXY_VERSION) is the single source of the
      # default version, also used by the scheduled rebuilds; an input version
      # is passed as --build-arg MAPPROXY_VERSION
      version-arg: MAPPROXY_VERSION
      version: ${{ inputs.mapproxy_version }}
      # scheduled rebuilds ignore the layer cache, so apt and pip fetch the
      # current packages even when the base image did not change
      no-cache: ${{ github.event_name == 'schedule' }}
      # title, version, source and licenses come from the Dockerfile
      labels: |
        org.opencontainers.image.description=Implementação de Imagem de Container OCI para o MapProxy
        org.opencontainers.image.url=https://github.com/nds-cprm/mapproxy-oci
      variants: |
        [
          {"name": "release", "target": "release", "tag": "{version}", "scan": true,
           "test": "sh .github/scripts/smoke-test.sh \"$IMAGE_REF\""}
        ]
