; CouchDB settings for the MapProxy tile cache example, loaded after the
; image defaults (the admin user comes from COUCHDB_USER/COUCHDB_PASSWORD)
[couchdb]
; single node: create the system databases (_users, _replicator) at startup
single_node = true

[cluster]
; one replica per database (the default, 3, assumes a 3-node cluster)
n = 1
