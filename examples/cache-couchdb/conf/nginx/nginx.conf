# Tile cache (WMTS/TMS), kept in the container's /tmp tmpfs
uwsgi_cache_path /tmp/nginx-cache levels=1:2 keys_zone=tiles:10m max_size=512m
                 inactive=1h use_temp_path=off;

# Concurrent connections per client (MapProxy has at most 16 workers)
limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream mapproxy {
    server mapproxy:8000;
}

server {
    listen 8080;

    # don't expose the nginx version in headers and error pages
    server_tokens off;

    # per client IP: behind a NAT, load balancer or TLS terminator many users
    # share one IP; raise the limit or use the real client IP (realip module)
    limit_conn perip 20;
    limit_conn_status 429;
    # rejections are expected under load: log them as warnings, not errors
    limit_conn_log_level warn;

    # capabilities and other XML documents compress well; images don't
    gzip on;
    gzip_types text/xml application/xml application/vnd.ogc.wms_xml application/vnd.ogc.se_xml;
    gzip_min_length 1024;

    include uwsgi_params;

    # keep in sync with uWSGI's harakiri (60 s)
    uwsgi_read_timeout 65s;

    # hold whole responses (e.g. large GetMap images) in memory, so the
    # uWSGI worker is released as soon as possible
    uwsgi_buffer_size 16k;
    uwsgi_buffers 16 64k;

    location / {
        uwsgi_pass mapproxy;
    }

    # tiles have stable URLs: serve repeated requests from the nginx cache
    location ~ ^/(wmts|tms)/ {
        uwsgi_pass mapproxy;

        uwsgi_cache tiles;
        uwsgi_cache_key $scheme$host$request_uri;
        # the Cache-Control sent by MapProxy (expires_hours: 24 in
        # mapproxy.yaml) takes precedence: tiles are kept for 24 h (or until
        # unused for 1 h, see inactive above). This only applies to responses
        # without it, e.g. if expires_hours is removed
        uwsgi_cache_valid 200 1h;
        uwsgi_cache_lock on;
        uwsgi_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
