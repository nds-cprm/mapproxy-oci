# MapProxy seeding configuration for conf/mapproxy/mapproxy.yaml.
# Based on the example generated by "mapproxy-util create -t base-config";
# see full_seed_example.yaml in the image and the MapProxy docs for more options.
#
# Run inside the mapproxy service (see README):
#   docker compose exec mapproxy mapproxy-seed \
#     -f /var/lib/mapproxy/config/mapproxy.yaml \
#     -s /var/lib/mapproxy/config/seed.yaml

seeds:
  # pre-generate the tiles of the upper levels over Brazil
  litoestratigrafia_brasil:
    caches: [litoestratigrafia_cache]
    grids: [webmercator]
    coverages: [brasil]
    levels:
      to: 8
    # re-create tiles older than 30 days
    refresh_before:
      days: 30

cleanups:
  # remove old tiles of the levels that are not seeded (created on demand).
  # With CouchDB (unlike a file cache) the cleanup can't list what is stored:
  # it checks every tile of the coverage, so it is limited to Brazil and to
  # levels 9-12 (~6 min); each extra level takes 4x longer. To drop the whole
  # cache, delete the database instead (see README)
  litoestratigrafia_old_tiles:
    caches: [litoestratigrafia_cache]
    grids: [webmercator]
    coverages: [brasil]
    remove_before:
      days: 14
    levels:
      from: 9
      to: 12

coverages:
  brasil:
    srs: 'EPSG:4674'
    bbox: [-74.0, -34.0, -34.0, 6.0]
