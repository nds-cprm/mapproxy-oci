name: mapproxy-cache-couchdb

# Logs go to stdout/stderr and are stored by the container runtime; without
# limits the json-file driver grows forever. With Docker, a host-wide default in
# /etc/docker/daemon.json (e.g. "log-driver": "local") is an alternative.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # Tile cache. Not published on the host: only mapproxy talks to it.
  # Runs as the image's couchdb user from the start: as root, its entrypoint
  # chowns /opt/couchdb and aborts (with no message) on the read-only ini.
  couchdb:
    image: docker.io/library/couchdb:3.5
    user: "5984:5984"
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-mapproxy}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD, e.g. in an .env file next to this one}
    volumes:
      - ./conf/couchdb/local.ini:/opt/couchdb/etc/local.d/10-mapproxy.ini:ro
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5984/_up"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    logging: *logging

  mapproxy:
    image: ${MAPPROXY_IMAGE:-docker.io/ndscprm/mapproxy:7.0.0}
    depends_on:
      couchdb:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # read by mapproxy.yaml (${MAPPROXY_CACHE_DIR}, ${UPSTREAM_WMS_URL},
      # ${COUCHDB_USER}, ${COUCHDB_PASSWORD}); the cache directory only holds
      # tile locks, so the /tmp tmpfs is enough
      MAPPROXY_CACHE_DIR: /tmp/mapproxy
      UPSTREAM_WMS_URL: https://geoservicos.sgb.gov.br/geoserver/ows?
      COUCHDB_USER: ${COUCHDB_USER:-mapproxy}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD, e.g. in an .env file next to this one}
    volumes:
      - ./conf/mapproxy/mapproxy.yaml:/var/lib/mapproxy/config/mapproxy.yaml:ro
      - ./conf/mapproxy/seed.yaml:/var/lib/mapproxy/config/seed.yaml:ro
    healthcheck:
      test: ["CMD", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    restart: unless-stopped
    logging: *logging

  # The image speaks the uwsgi protocol on port 8000; nginx exposes it as HTTP.
  # Unprivileged image: runs as UID 101 and listens on 8080.
  nginx:
    image: docker.io/nginxinc/nginx-unprivileged:1.30-alpine
    depends_on:
      mapproxy:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8080:8080"
    volumes:
      - ./conf/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    logging: *logging

volumes:
  couchdb-data:
