# Concurrent connections per client (MapProxy has at most 16 workers)
limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream mapproxy {
    server mapproxy:8000;
}

server {
    listen 8080;

    # don't expose the nginx version in headers and error pages
    server_tokens off;

    # per client IP: behind a NAT, load balancer or TLS terminator many users
    # share one IP; raise the limit or use the real client IP (realip module)
    limit_conn perip 20;
    limit_conn_status 429;
    # rejections are expected under load: log them as warnings, not errors
    limit_conn_log_level warn;

    # capabilities and other XML documents compress well; images don't
    gzip on;
    gzip_types text/xml application/xml application/vnd.ogc.wms_xml application/vnd.ogc.se_xml;
    gzip_min_length 1024;

    include uwsgi_params;

    # keep in sync with uWSGI's harakiri (60 s)
    uwsgi_read_timeout 65s;

    # hold whole responses (e.g. large GetMap images) in memory, so the
    # uWSGI worker is released as soon as possible
    uwsgi_buffer_size 16k;
    uwsgi_buffers 16 64k;

    location / {
        uwsgi_pass mapproxy;
    }

    # WMTS RESTful tiles straight from the MapProxy cache volume (mounted
    # read-only), when the cache follows the convention of mapproxy.yaml:
    # directory_layout tms in <cache dir>/<layer>/<grid>, so the file path
    # matches /wmts/<layer>/<grid>/<z>/<x>/<y>.<ext>. Missing tiles (and
    # layers that don't follow it) fall back to MapProxy, which creates and
    # stores them. Layer and grid names: letters, digits, "_" and "-".
    location ~ "^/wmts/(?<layer>[A-Za-z0-9_-]+)/(?<grid>[A-Za-z0-9_-]+)/(?<z>[0-9]+)/(?<x>[0-9]+)/(?<y>[0-9]+)\.(?<ext>png|jpeg)$" {
        root /var/lib/mapproxy/cache;
        try_files /$layer/$grid/$z/$x/$y.$ext @mapproxy;

        # same header MapProxy sends for expires_hours: 24 in mapproxy.yaml
        # (disk hits only; MapProxy sets its own on the fallback)
        add_header Cache-Control "public, max-age=86400, s-maxage=86400";
        add_header X-Tile-Source disk;
    }

    location @mapproxy {
        uwsgi_pass mapproxy;
        add_header X-Tile-Source mapproxy;
    }
}
